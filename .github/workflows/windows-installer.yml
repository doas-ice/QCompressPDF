name: Build and verify release
on:
  push:
    branches: ['release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ghostscript libegl1 libopengl0
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python compress_qt.py --self-test
      - run: bash -n install_kde_service.sh && git diff --check
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set release version
        shell: pwsh
        run: |
          $version = '1.6.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v','' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected vMAJOR.MINOR.PATCH' }
          "QCOMPRESSPDF_VERSION=$version" >> $env:GITHUB_ENV
          (Get-Content compress_qt.py) -replace 'CURRENT_VERSION\s*=\s*".*"', "CURRENT_VERSION = `"$version`"" | Set-Content -Encoding utf8 compress_qt.py
      - run: python -m pip install --timeout 30 --retries 2 -r requirements.txt pyinstaller==6.16.0
      - name: Build and validate offline installer
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Regression tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Published legacy migration, failure, environment and uninstall tests
        shell: pwsh
        run: ./scripts/test_windows_install.ps1
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem Output -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content Output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-${{ matrix.os }}
          path: Output/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/legacy-*.log
            ${{ runner.temp }}/qcompresspdf-*.log
  release:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-2022
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: RELEASE_NOTES.md
          files: release/*
