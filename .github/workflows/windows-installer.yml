name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    permissions: 
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure requirements.txt is present
        run: |
          if (!(Test-Path requirements.txt)) { exit 1 }
        shell: pwsh

      - name: Ensure compress_qt.py is present
        run: |
          if (!(Test-Path compress_qt.py)) { exit 1 }
        shell: pwsh

      - name: Ensure CompressPDF.iss is present
        run: |
          if (!(Test-Path CompressPDF.iss)) { exit 1 }
        shell: pwsh
  
      - name: Update CURRENT_VERSION in compress_qt.py from Git tag
        # This step extracts the pushed tag (refs/tags/vX.Y.Z), strips the leading 'v' if present,
        # and replaces the CURRENT_VERSION = "..." line in compress_qt.py before building.
        run: |
          $tag = "${{ github.ref }}" -replace '^refs/tags/',''
          $ver = $tag -replace '^v',''
          Write-Host "Git tag = $tag ; Setting CURRENT_VERSION to $ver"
          (Get-Content compress_qt.py) -replace 'CURRENT_VERSION\s*=\s*".*"', "CURRENT_VERSION = `"$ver`"" | Set-Content -Encoding utf8 compress_qt.py
        shell: pwsh

      - name: Build Windows Installer with iscc
        run: |
          iscc CompressPDF.iss

      - name: List installer files
        run: dir Output
        shell: pwsh

      - name: Upload Installer as Release Asset
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            Output/QCompressPDF.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
